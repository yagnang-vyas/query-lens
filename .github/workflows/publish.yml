name: Publish

# Builds the sdist and wheel and uploads them to PyPI with Trusted Publishing
# (OIDC). No PyPI API token is stored in the repository.
#
# Triggers:
#   - A GitHub Release is published (normal path for every version after setup).
#   - workflow_dispatch (needed once for the existing v0.1.0 release, or for a
#     dry-run rebuild from a tag).
#
# One-time PyPI setup is documented in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/slowlens
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
