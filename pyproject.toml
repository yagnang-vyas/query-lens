[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ understands the PEP 639 license fields below
build-backend = "hatchling.build"

[project]
# PyPI / import / CLI name. Product branding remains "QueryLens".
# The name "querylens" is taken on PyPI by an unrelated project.
name = "slowlens"
dynamic = ["version"]
description = "Offline analyzer for PostgreSQL and MySQL slow query logs: fingerprints, statistics and heuristic hints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yagnang Vyas" }]
keywords = ["postgresql", "mysql", "slow-query-log", "performance", "cli", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
slowlens = "slowlens.cli:main"

[project.urls]
Homepage = "https://github.com/yagnang-vyas/query-lens"
Issues = "https://github.com/yagnang-vyas/query-lens/issues"

[tool.hatch.version]
path = "src/slowlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slowlens"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SPEC.md",
    "RELEASING.md",
    "AGENTS.md",
    "Makefile",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["slowlens"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
